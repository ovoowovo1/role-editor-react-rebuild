<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075.1329999999998 440" width="1075.1329999999998" height="440" style="--bg: #FFFFFF; --fg: #27272A; background: var(--bg); width: 880.156px; height: 360.205px;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)"/>
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1"/>
  </marker>
</defs>
<line class="lifeline" data-actor="React" x1="116.99949999999998" y1="70" x2="116.99949999999998" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<line class="lifeline" data-actor="Stage" x1="308.39799999999997" y1="70" x2="308.39799999999997" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<line class="lifeline" data-actor="Runtime" x1="501.64899999999994" y1="70" x2="501.64899999999994" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<line class="lifeline" data-actor="Pixi" x1="692.3064999999999" y1="70" x2="692.3064999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<line class="lifeline" data-actor="Canvas" x1="859.6225" y1="70" x2="859.6225" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<line class="lifeline" data-actor="User" x1="1005.1329999999999" y1="70" x2="1005.1329999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4"/>
<g class="message" data-from="React" data-to="Stage" data-label="pass role, selectedIds, stageScale" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="116.99949999999998" y1="90" x2="308.39799999999997" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)"/>
  <text x="212.69874999999996" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">pass role, selectedIds, stageScale</text>
</g>
